[project]
name = "batchlane"
description = "Submit async batch jobs to any LLM provider's discount lane, or refuse honestly"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
requires-python = ">=3.11"
version = "0.1.0"
keywords = ["llm", "batch", "inference", "litellm", "groq", "gemini", "mistral"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # The only reason to depend on litellm: its per-provider request/response
    # transforms are pure, synchronous, and maintained against provider drift.
    # Pinned to a floor because they are internal API, not published surface --
    # tests/test_translate.py pins their output so a bump fails loudly.
    "litellm>=1.80.10",
    "httpx>=0.27",
    # Retry/backoff only. litellm's own AsyncHTTPHandler exists to feed its
    # cost-logging pipeline, which this package deliberately excludes.
    "tenacity>=9",
]

[project.urls]
Homepage = "https://github.com/gojiplus/batchlane"
Repository = "https://github.com/gojiplus/batchlane"
"Bug Tracker" = "https://github.com/gojiplus/batchlane/issues"

[project.scripts]
batchlane = "batchlane.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "batchlane"

[dependency-groups]
dev = [
    { include-group = "test" },
    "ruff>=0.14",
    "pyright>=1.1.390",
    # py-canon CI runs this; keep it local so lint failures surface here first.
    "pydoclint>=0.9",
]
test = ["pytest>=8", "pytest-cov>=5", "respx>=0.21"]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "8"
xfail_strict = true
filterwarnings = ["error"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
markers = ["live: hits real provider APIs; needs keys and BATCHLANE_LIVE=1"]

[tool.coverage.run]
source = ["src"]

[tool.codespell]
# "trough" is the demand trough in a GPU fleet's utilisation curve -- the
# reason batch discounts exist at all -- not a misspelling of "through".
ignore-words-list = "trough"

[tool.preen]
# A placeholder host on an httpx.Request that is constructed only to satisfy
# litellm's response-transform signature and is never sent anywhere.
link_ignore = [
    # Not documentation links: these are provider API bases and endpoints,
    # which correctly answer 404 or 401 to the bare GET a link checker makes.
    "https://api.openai.com/*",
    "https://api.groq.com/*",
    "https://api.together.xyz/*",
    "https://api.deepinfra.com/*",
    "https://api.anthropic.com/*",
    "https://generativelanguage.googleapis.com/*",
    # A placeholder host on an httpx.Request built only to satisfy litellm's
    # response-transform signature; it is never sent anywhere.
    "https://batchlane.local/*",
]
src_layout = true
tests_at_root = true
