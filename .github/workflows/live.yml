name: Live provider tests

# Hits real provider APIs and spends real money, so never on push or PR.
# Batches are 2 lines at max_tokens=8; the bill is rounding error, but the
# point is that only a human or the weekly cron decides to pay it.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned: a tag is mutable, and this job holds provider API keys.
      # Dependabot bumps these by SHA and records the version in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
      - run: uv sync --all-extras
      - run: uv run pytest -m live -v
        env:
          BATCHLANE_LIVE: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          DEEPINFRA_TOKEN: ${{ secrets.DEEPINFRA_TOKEN }}
